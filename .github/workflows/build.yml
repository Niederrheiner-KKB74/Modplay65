name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_MOS_SDK_VERSION: v23.4.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-mos SDK
        run: |
          wget -q "https://github.com/llvm-mos/llvm-mos-sdk/releases/download/${LLVM_MOS_SDK_VERSION}/llvm-mos-linux.tar.xz"
          tar xf llvm-mos-linux.tar.xz -C "$HOME"
          "$HOME/llvm-mos/bin/mos-mega65-clang" --version

      - name: Configure
        run: cmake -DCMAKE_PREFIX_PATH="$HOME/llvm-mos" -B build

      - name: Build
        run: cmake --build build

      - name: Show result
        run: |
          ls -l build/modplay65.prg
          sha256sum build/modplay65.prg

      - name: Upload PRG
        uses: actions/upload-artifact@v4
        with:
          name: modplay65-prg
          path: build/modplay65.prg
          if-no-files-found: error
