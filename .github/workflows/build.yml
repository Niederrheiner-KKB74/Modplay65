name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # only used by the release step for v* tags

env:
  LLVM_MOS_SDK_VERSION: v23.4.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host unit tests
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure

      - name: Install llvm-mos SDK
        run: |
          wget -q "https://github.com/llvm-mos/llvm-mos-sdk/releases/download/${LLVM_MOS_SDK_VERSION}/llvm-mos-linux.tar.xz"
          tar xf llvm-mos-linux.tar.xz -C "$HOME"
          "$HOME/llvm-mos/bin/mos-mega65-clang" --version

      - name: Configure
        run: cmake -DCMAKE_PREFIX_PATH="$HOME/llvm-mos" -B build

      - name: Build
        run: cmake --build build

      - name: D81 image
        run: python3 tools/mkd81/mkd81.py build/modplay65.d81 "MODPLAY65,65" build/modplay65.prg

      - name: Show result
        run: |
          ls -l build/modplay65.prg build/modplay65.d81
          sha256sum build/modplay65.prg build/modplay65.d81

      - name: Upload PRG and D81
        uses: actions/upload-artifact@v4
        with:
          name: modplay65
          path: |
            build/modplay65.prg
            build/modplay65.d81
          if-no-files-found: error

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/modplay65.prg build/modplay65.d81 \
            --title "Modplay65 ${GITHUB_REF_NAME#v}" --notes-file docs/RELEASE-NOTES.md
